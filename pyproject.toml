[project]
name = "france-electricity-forecasting"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "requests",
    "pandera",
    "pyarrow",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
ingest = "felec.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/felec"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
